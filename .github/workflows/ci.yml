name: Website QA

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://gimungiki.org
      SUBMISSIONS_BACKEND: memory
      ALLOW_IN_MEMORY_SUBMISSIONS: '1'
      SUBMISSIONS_TEST_MODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate content schema
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Link audit
        run: npm run audit:links

      - name: Accessibility audit
        run: npm run audit:a11y

      - name: SEO audit
        run: npm run audit:seo

      - name: Form security smoke tests
        run: npm run test:forms

      - name: Submission architecture contract audit
        run: npm run audit:submissions

      - name: Rendered browser and axe tests
        run: npm run test:browser

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Report production content gate
        run: npm run validate:launch

  lighthouse-release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://gimungiki.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release candidate
        run: npm run build

      - name: Lighthouse release gate
        run: npm run audit:lighthouse
