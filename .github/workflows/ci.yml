name: Website QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'release/**']

# Read-only token: no job needs to write to the repository.
permissions:
  contents: read

# A newer push supersedes a running check on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://gimungiki.org
      SUBMISSIONS_BACKEND: memory
      ALLOW_IN_MEMORY_SUBMISSIONS: '1'
      SUBMISSIONS_TEST_MODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run scan:secrets

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate content schema
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: PostgreSQL migration tests
        run: npm run test:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: First-load bundle guard
        run: npm run audit:bundle

      - name: Link audit
        run: npm run audit:links

      - name: Accessibility audit
        run: npm run audit:a11y

      - name: SEO audit
        run: npm run audit:seo

      - name: Form security smoke tests
        run: npm run test:forms

      - name: Submission architecture contract audit
        run: npm run audit:submissions

      - name: Rendered browser and axe tests
        run: npm run test:browser

      - name: Admin integration tests
        run: npm run test:admin

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/
          if-no-files-found: ignore


  lighthouse-release:
    needs: qa
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://gimungiki.org
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release candidate
        run: npm run build

      - name: Lighthouse release gate
        run: npm run audit:lighthouse

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse
          # lighthouserc.json writes the reports to artifacts/lighthouse; .lighthouseci holds the raw runs.
          path: |
            artifacts/lighthouse/
            .lighthouseci/
          if-no-files-found: ignore

  launch-content:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:launch
