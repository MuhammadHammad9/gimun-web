name: Website QA

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://gimungiki.org
      SUBMISSIONS_BACKEND: memory
      ALLOW_IN_MEMORY_SUBMISSIONS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content schema
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Link audit
        run: npm run audit:links

      - name: Accessibility audit
        run: npm run audit:a11y

      - name: SEO audit
        run: npm run audit:seo

      - name: Form security smoke tests
        run: npm run test:forms

      - name: Report production content gate
        run: npm run validate:launch
